name: build
on: [push, pull_request]
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "ruby"
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake make gcc perl zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev libdeflate-dev
      - name: Install autotools (macos)
        if: ${{ matrix.os == 'macos' }}
        run: brew install autoconf automake libdeflate xz
      - name: Build executable
        run: make
      - name: Run executable (help)
        run: samtools/samtools tanuki
      - name: Run mruby view smoke tests
        run: |
          set -eu
          test "$(samtools/samtools view -E 'qname == "a1"' 'htslib/test/xx#MD2.sam' | wc -l | tr -d ' ')" = 1
          samtools/samtools view -E 'puts "#{qname}:#{tag("NM")}" if qname == "a1"; false' 'htslib/test/xx#MD2.sam' | grep -qx 'a1:0'
          samtools/samtools view -E 'proper_pair?' htslib/test/colons.bam > /dev/null
          if samtools/samtools view -E 'if ' htslib/test/colons.bam > /dev/null 2>&1; then
            echo "invalid mruby expression unexpectedly succeeded" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: samtools-mruby-${{ matrix.os }}
          path: samtools/samtools
